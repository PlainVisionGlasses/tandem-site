<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mail · Tandem</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --aqua-50:#e6fbfb;--aqua-100:#c2f5f5;--aqua-300:#6fe3e3;--aqua-500:#1fc8c8;--aqua-600:#14a8a8;--aqua-700:#0d8a8a;
      --ink:#0e2a2a;--ink-soft:#4a6a6a;--white:#fff;
      --shadow-md:0 8px 28px rgba(14,42,42,.10);--shadow-lg:0 18px 50px rgba(14,42,42,.16);
      --ease:cubic-bezier(.22,1,.36,1);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);min-height:100vh;
      background:
        radial-gradient(1200px 600px at 10% -10%, var(--aqua-100), transparent 60%),
        radial-gradient(900px 500px at 110% 10%, #e9fffb, transparent 55%),
        linear-gradient(180deg,#f7fffe 0%,#fff 55%,#f4fdfd 100%);
      -webkit-font-smoothing:antialiased;padding:40px 20px}
    .wrap{max-width:900px;margin:0 auto}
    a.back{display:inline-block;margin-bottom:18px;color:var(--aqua-700);text-decoration:none;font-weight:600;font-size:.9rem}
    a.back:hover{text-decoration:underline}
    h1{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
    .sub{color:var(--ink-soft);margin-bottom:30px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
    .mail-card{
      display:flex;flex-direction:column;gap:12px;
      background:rgba(255,255,255,.85);border:1px solid rgba(31,200,200,.2);
      border-radius:20px;box-shadow:var(--shadow-md);padding:22px;
      text-decoration:none;color:var(--ink);
      transition:transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease);
    }
    .mail-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--aqua-500)}
    .mail-card .ico{
      width:46px;height:46px;border-radius:14px;
      background:linear-gradient(135deg,var(--aqua-100),#eafefe);
      display:grid;place-items:center;font-size:1.35rem;color:var(--aqua-700);
    }
    .mail-card h2{font-size:1.08rem;font-weight:800;letter-spacing:-.01em}
    .mail-card p{font-size:.88rem;color:var(--ink-soft);line-height:1.5}
    .mail-card .cta{
      margin-top:8px;font-size:.85rem;font-weight:700;color:var(--aqua-700);
      display:inline-flex;align-items:center;gap:6px;
    }
    .mail-card:hover .cta{text-decoration:underline}
    .empty{
      background:rgba(255,255,255,.7);border:1.5px dashed rgba(31,200,200,.4);
      border-radius:20px;padding:22px;color:var(--ink-soft);font-size:.92rem;text-align:center;
    }
    .empty a{color:var(--aqua-700);font-weight:700;text-decoration:none}
    .empty a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="wrap">
    <a href="/" class="back">← Back to home</a>
    <h1>Email Inbox Selection</h1>
    <p class="sub">Pick which inbox to open. Configure the links in your Profile → Edit links.</p>

    <div class="grid" id="grid">
      <!-- Cards are rendered by the script below -->
    </div>
  </div>

  <script type="module">
    import { requireAuth } from './auth.js';
    import { getUserLinks, isSafeUrl } from './links.js';

    const session = await requireAuth();
    if (!session) throw new Error('not signed in');

    const links = await getUserLinks();
    const grid = document.getElementById('grid');

    const accounts = [
      { key: 'mail_college',    title: 'College email',    desc: 'Your college-assigned inbox.',       icon: '🎓' },
      { key: 'mail_highschool', title: 'High school email', desc: 'Your high school-assigned inbox.',  icon: '🏫' },
      { key: 'mail_personal',   title: 'Personal email',    desc: 'Your personal inbox.',              icon: '📧' },
    ];

    const configured = accounts.filter(a => isSafeUrl(links[a.key] || ''));
    const missing = accounts.filter(a => !isSafeUrl(links[a.key] || ''));

    configured.forEach((a) => {
      const el = document.createElement('a');
      el.className = 'mail-card';
      el.href = links[a.key];
      el.target = '_blank';
      el.rel = 'noopener';
      el.innerHTML = `
        <div class="ico">${a.icon}</div>
        <h2>${a.title}</h2>
        <p>${a.desc}</p>
        <span class="cta">Open inbox →</span>
      `;
      grid.appendChild(el);
    });

    if (configured.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.style.gridColumn = '1 / -1';
      empty.innerHTML = `No mail links yet. Go to <a href="/profile.html">Profile → Edit links</a> and add your college, high school, and personal inbox URLs.`;
      grid.appendChild(empty);
    } else if (missing.length > 0) {
      const note = document.createElement('div');
      note.className = 'empty';
      note.style.gridColumn = '1 / -1';
      note.style.marginTop = '8px';
      const labels = missing.map(m => m.title).join(', ');
      note.innerHTML = `${labels} not set yet. Add them in <a href="/profile.html">Profile → Edit links</a>.`;
      grid.appendChild(note);
    }
  </script>
</body>
</html>
