<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile · Tandem</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--aqua-100:#c2f5f5;--aqua-300:#6fe3e3;--aqua-500:#1fc8c8;--aqua-600:#14a8a8;--aqua-700:#0d8a8a;--ink:#0e2a2a;--ink-soft:#4a6a6a;--ease:cubic-bezier(.22,1,.36,1)}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);min-height:100vh;
      background:radial-gradient(1200px 600px at 10% -10%,var(--aqua-100),transparent 60%),radial-gradient(900px 500px at 110% 10%,#e9fffb,transparent 55%),linear-gradient(180deg,#f7fffe 0%,#fff 55%,#f4fdfd 100%);-webkit-font-smoothing:antialiased;padding:40px 20px}
    .wrap{max-width:560px;margin:0 auto}
    h1{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
    .sub{color:var(--ink-soft);margin-bottom:24px}
    .card{background:rgba(255,255,255,.85);border:1px solid rgba(31,200,200,.2);border-radius:20px;box-shadow:0 8px 28px rgba(14,42,42,.10);padding:24px}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:.78rem;font-weight:600;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
    .field .val{font-size:1.02rem;font-weight:600}
    .actions{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap}
    .btn{padding:11px 22px;border-radius:999px;font:inherit;font-weight:700;font-size:.92rem;cursor:pointer;text-decoration:none;border:none;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
    .btn-primary{color:#fff;background:linear-gradient(135deg,var(--aqua-500),var(--aqua-700));box-shadow:0 8px 20px rgba(20,168,168,.3)}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(20,168,168,.4)}
    .btn-ghost{color:var(--aqua-700);background:#fff;border:1.5px solid rgba(31,200,200,.4)}
    .btn-ghost:hover{background:#f5fffe}
    a.back{display:inline-block;margin-bottom:18px;color:var(--aqua-700);text-decoration:none;font-weight:600;font-size:.9rem}
    a.back:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="wrap">
    <a href="/" class="back">← Back to home</a>
    <h1 id="greeting">Profile</h1>
    <p class="sub">Your Tandem account details.</p>
    <div class="card">
      <div class="field"><label>Full name</label><div class="val" id="name">—</div></div>
      <div class="field"><label>Username</label><div class="val" id="username">—</div></div>
      <div class="field"><label>Email</label><div class="val" id="email">—</div></div>
      <div class="field"><label>Timezone</label><div class="val" id="timezone">—</div></div>
      <div class="actions">
        <a class="btn btn-primary" href="/">Home</a>
        <button class="btn btn-ghost" id="logoutBtn">Log out</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { requireAuth, logout } from "./auth.js";
    import { supabase } from "./supabase.js";

    const session = await requireAuth();
    if (session) {
      const { data: profile } = await supabase
        .from("profiles")
        .select("*")
        .eq("id", session.user.id)
        .single();

      if (profile) {
        const name = profile.display_name || "Friend";
        document.getElementById("greeting").textContent = `${name}'s Profile`;
        document.getElementById("name").textContent = profile.display_name || "—";
        document.getElementById("username").textContent = profile.username || "—";
        document.getElementById("email").textContent = profile.email || "—";
        document.getElementById("timezone").textContent = profile.timezone || "—";
      }
    }

    document.getElementById("logoutBtn").addEventListener("click", logout);
  </script>
</body>
</html>
